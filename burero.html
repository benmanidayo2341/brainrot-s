<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ブレインロット販売</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #111;
      color: #eee;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 40px;
      justify-content: center;
    }

    .card {
      background-color: #222;
      border: 1px solid #444;
      border-radius: 8px;
      width: 220px;
      padding: 16px;
      position: relative;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      border-radius: 4px;
    }

    .card h3 {
      margin: 10px 0 4px;
      font-size: 18px;
    }

    .card .variant {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 12px;
    }

    .buy-button {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0f0;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover .buy-button {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="blue-brainrot.png" alt="青いブレインロット">
    <h3>青いブレインロット</h3>
    <div class="variant">変異：冷却型</div>
    <button class="buy-button">購入する</button>
  </div>

  <div class="card">
    <img src="glitch-brainrot.png" alt="グリッチ・ブレインロット">
    <h3>グリッチ・ブレインロット</h3>
    <div class="variant">変異：不安定</div>
    <button class="buy-button">購入する</button>
  </div>

  <!-- 他のカードも同じ構造で追加可能 -->

</body>
</html>
