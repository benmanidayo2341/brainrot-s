<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Brainrot Shop</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #111;
      color: #eee;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 40px;
      justify-content: center;
    }

    /* お知らせバー */
    .ticker {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #ff0;
      color: #000;
      font-weight: bold;
      font-size: 18px;
      padding: 8px 0;
      overflow: hidden;
      z-index: 10;
      box-shadow: 0 0 10px #ff0;
    }

    .ticker-text {
      display: inline-block;
      white-space: nowrap;
      animation: scroll 12s linear infinite;
    }

    @keyframes scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    header {
      width: 100%;
      text-align: center;
      margin-top: 60px; /* お知らせバーの高さ分ずらす */
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 36px;
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
    }

    .card {
      background-color: #222;
      border: 1px solid #444;
      border-radius: 8px;
      width: 220px;
      padding: 16px;
      position: relative;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      border-radius: 4px;
    }

    .card h3 {
      margin: 10px 0 4px;
      font-size: 18px;
    }

    .card .variant {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 12px;
    }

    .buy-button {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0f0;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover .buy-button {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="ticker">
    <div class="ticker-text">サイトオープン記念セール開催中!!!</div>
  </div>

  <header>
    <h1>Brainrot Shop</h1>
  </header>

  <div class="card">
    <img src="1.png" alt="Job Job Sahur">
    <h3>Job Job Sahur</h3>
    <div class="variant">変異：ゴールド</div>
    <button class="buy-button">購入する</button>
  </div>

  <div class="card">
    <img src="2.png" alt="保留">
    <h3>グリッチ・ブレインロット</h3>
    <div class="variant">変異：不安定</div>
    <button class="buy-button">購入する</button>
  </div>

</body>
</html>
