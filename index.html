<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Brainrot Shop</title>
  <style>
    @font-face {
      font-family: 'KeiFont';
      src: url('keifont.woff2') format('woff2');
    }

    body {
      font-family: sans-serif;
      background-color: #111;
      color: #eee;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 40px;
      justify-content: center;
    }

    .ticker {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #ff0;
      color: #000;
      font-weight: bold;
      font-size: 18px;
      padding: 8px 0;
      text-align: center;
      z-index: 10;
      box-shadow: 0 0 10px #ff0;
    }

    header {
      width: 100%;
      text-align: center;
      margin-top: 60px;
      margin-bottom: 20px;
    }

    header img {
      max-width: 300px;
      height: auto;
      filter: drop-shadow(0 0 10px #0ff);
    }

    .card {
      background-color: #222;
      border: 1px solid #444;
      border-radius: 8px;
      width: 220px;
      padding: 16px;
      position: relative;
      transition: transform 0.2s ease;
      overflow: hidden;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      border-radius: 4px;
      display: block;
    }

    /* 値段バッジ */
    .price-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 255, 0, 0.85);
      color: #000;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 14px;
      box-shadow: 0 0 6px rgba(0,255,0,0.6);
    }

    .card h3 {
      margin: 10px 0 4px;
      font-size: 18px;
    }

    .card .variant {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 12px;
    }

    .buy-button {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0f0;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover .buy-button {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="ticker">お知らせのテスト</div>

  <header>
    <!-- タイトル削除済み -->
    <img src="logo.png" alt="Brainrot Shop ロゴ">
  </header>

  <div class="card">
    <span class="price-tag">¥200</span>
    <img src="1.png" alt="Job Job Sahur">
    <h3>Job Job Sahur</h3>
    <div class="variant">変異/属性：ゴールド</div>
    <button class="buy-button">購入する</button>
  </div>

  <div class="card">
    <span class="price-tag">¥500</span>
    <img src="2.png" alt="Guerriro Digitale">
    <h3>Guerriro Digitale</h3>
    <div class="variant">変異/属性：陰陽/火</div>
    <button class="buy-button">購入する</button>
  </div>

</body>
</html>
