<style>
  .ticker {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background-color: #ff0;
    color: #000;
    font-weight: bold;
    font-size: 18px;
    padding: 8px 0;
    overflow: hidden;
    z-index: 10;
    box-shadow: 0 0 10px #ff0;
  }

  .ticker-track {
    display: flex;
    width: max-content;
    animation: scroll-loop 20s linear infinite;
    transform: translateX(100%); /* ← ここで右端からスタート */
  }

  .ticker-text {
    padding: 0 40px;
    white-space: nowrap;
  }

  @keyframes scroll-loop {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }
</style>

<div class="ticker">
  <div class="ticker-track">
    <div class="ticker-text">サイトオープン記念セール開催中!!!</div>
    <div class="ticker-text">サイトオープン記念セール開催中!!!</div>
  </div>
</div>
